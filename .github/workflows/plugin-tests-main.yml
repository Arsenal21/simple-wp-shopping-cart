name: Plugin Tests (WPSC Main)

# Runs only when started by hand: Actions tab > "Plugin Tests (WPSC Main)" > Run workflow (choose the branch to test and the test groups to run).
on:
  workflow_dispatch:
    inputs:
      run_lint:
        description: Lint (PHP syntax check on the oldest and newest PHP)
        type: boolean
        default: true
      run_standalone:
        description: Standalone tests (the PHP and Node test scripts in tests/)
        type: boolean
        default: true
      run_phpunit:
        description: PHPUnit tests (tests/phpunit)
        type: boolean
        default: true
      run_endpoint_tests:
        description: Endpoint tests (add to cart, cart page, PayPal notification and manual checkout requests to a test site)
        type: boolean
        default: true

jobs:
  lint:
    if: ${{ inputs.run_lint }}
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported PHP version and the newest one.
        php: ['7.4', '8.5']
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint the plugin's PHP files and the test files (the third-party Stripe library is excluded)
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! out=$(php -l "$file" 2>&1); then
              echo "$out"
              failed=1
            fi
          done < <(find wordpress-paypal-shopping-cart tests -name '*.php' \
            -not -path 'wordpress-paypal-shopping-cart/lib/stripe-gateway/*' \
            -not -path 'tests/phpunit/vendor/*' -print0)
          if [ "$failed" -ne 0 ]; then
            echo "Syntax errors found."
            exit 1
          fi
          echo "No syntax errors."

  standalone:
    # The older test scripts in tests/ that run without a database: WordPress and the payment requests are stubbed
    # (plugin-check-output.php uses the real WordPress KSES code, so WordPress is downloaded for it).
    if: ${{ inputs.run_standalone }}
    name: Standalone tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download WordPress (for the KSES output test)
        run: |
          mkdir -p /tmp/wordpress
          curl -sSL https://wordpress.org/latest.tar.gz | tar -xz --strip-components=1 -C /tmp/wordpress

      - name: PayPal payment notification recipient check
        run: php tests/paypal-recipient.php

      - name: Product form output through KSES
        run: php tests/plugin-check-output.php /tmp/wordpress

      - name: Product form events (variations, normal and AJAX add to cart)
        run: node tests/product-form-events.js

      - name: PayPal button rendering timing
        run: node tests/paypal-render-timing.js

      - name: PayPal Standard cart update after AJAX add to cart
        run: node tests/paypal-standard-cart-update.js

  phpunit:
    if: ${{ inputs.run_phpunit }}
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']

    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none

      - name: Install Subversion (the WordPress test library is downloaded with it)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress and its test library
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - name: Install the PHPUnit packages
        working-directory: tests/phpunit
        run: composer install --no-interaction --no-progress

      - name: Run the PHPUnit tests
        working-directory: tests/phpunit
        run: vendor/bin/phpunit --testdox -c phpunit.xml.dist

  endpoint-tests:
    # Sends the requests of a shopping session (add to cart, the cart page, the PayPal payment notification, manual checkout)
    # to a real WordPress test site with a fake PayPal verification (tests/e2e/mu-plugin-e2e-fakes.php), then checks the database.
    if: ${{ inputs.run_endpoint_tests }}
    name: Endpoint tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']

    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      E2E_URL: http://127.0.0.1:8080
      E2E_WP_PATH: /tmp/e2e-site
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_NAME: wordpress_e2e
      E2E_DB_USER: root
      E2E_DB_PASS: root

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, curl, dom
          tools: wp-cli
          coverage: none

      - name: Install a WordPress test site with the plugin
        run: |
          wp core download --path="$E2E_WP_PATH" --version=latest
          wp config create --path="$E2E_WP_PATH" --dbname="$E2E_DB_NAME" --dbuser="$E2E_DB_USER" --dbpass="$E2E_DB_PASS" --dbhost="$E2E_DB_HOST:3306"
          wp config set DISABLE_WP_CRON true --raw --path="$E2E_WP_PATH"
          wp config set WP_DEBUG true --raw --path="$E2E_WP_PATH"
          wp config set WP_DEBUG_LOG true --raw --path="$E2E_WP_PATH"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$E2E_WP_PATH"
          wp db create --path="$E2E_WP_PATH"
          wp core install --path="$E2E_WP_PATH" --url="$E2E_URL" --title="WPSC Endpoint Tests" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp option update permalink_structure '' --path="$E2E_WP_PATH"
          cp -r wordpress-paypal-shopping-cart "$E2E_WP_PATH/wp-content/plugins/wordpress-paypal-shopping-cart"
          mkdir -p "$E2E_WP_PATH/wp-content/mu-plugins"
          cp tests/e2e/mu-plugin-e2e-fakes.php "$E2E_WP_PATH/wp-content/mu-plugins/"
          wp plugin activate wordpress-paypal-shopping-cart --path="$E2E_WP_PATH"

      - name: Start the web server
        run: |
          php -S 127.0.0.1:8080 -t "$E2E_WP_PATH" > /tmp/php-server.log 2>&1 &
          sleep 2
          curl --silent --fail --output /dev/null "$E2E_URL/" && echo "The test site is running."

      - name: Run the endpoint tests
        run: php tests/e2e/run-endpoint-tests.php

      - name: Show the plugin's debug log, the PHP error log and the web server log (only when a test failed)
        if: failure()
        run: |
          cat "$E2E_WP_PATH"/wp-content/plugins/wordpress-paypal-shopping-cart/wspsc-debug-log-*.txt || true
          cat "$E2E_WP_PATH"/wp-content/debug.log || true
          cat /tmp/php-server.log || true
